<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">Area51 Architecture</title>
  <desc id="desc">A layered architecture diagram showing platform inputs, the host control plane, per-session database boundary, session container, and quarantine evidence outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31556b" />
    </marker>
    <style>
      .bg { fill: #f7faf9; }
      .zone { fill: #ffffff; stroke: #c8d8d3; stroke-width: 2; }
      .zone-title { fill: #18313f; font: 700 20px Arial, sans-serif; }
      .zone-sub { fill: #52656f; font: 14px Arial, sans-serif; }
      .node { fill: #ffffff; stroke: #6f8f9f; stroke-width: 2; }
      .input { fill: #edf7f4; stroke: #3b8c77; }
      .host { fill: #eef5fb; stroke: #497ca0; }
      .store { fill: #fff8e8; stroke: #b98228; }
      .runtime { fill: #f1effb; stroke: #6c5aa8; }
      .risk { fill: #fff0ee; stroke: #bd584a; }
      .label { fill: #17313f; font: 700 16px Arial, sans-serif; }
      .small { fill: #4f6570; font: 13px Arial, sans-serif; }
      .tiny { fill: #61747d; font: 12px Arial, sans-serif; }
      .flow { fill: none; stroke: #31556b; stroke-width: 2.4; marker-end: url(#arrow); }
      .guard { fill: none; stroke: #bd584a; stroke-width: 2.2; marker-end: url(#arrow); stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1180" height="680" rx="28" />

  <rect class="zone" x="34" y="40" width="248" height="580" rx="18" />
  <text class="zone-title" x="62" y="78">Platform Edge</text>
  <text class="zone-sub" x="62" y="102">Untrusted inputs enter here</text>

  <rect class="zone" x="320" y="40" width="260" height="580" rx="18" />
  <text class="zone-title" x="348" y="78">Host Control Plane</text>
  <text class="zone-sub" x="348" y="102">Identity, routing, policy</text>

  <rect class="zone" x="620" y="40" width="230" height="580" rx="18" />
  <text class="zone-title" x="648" y="78">Session Boundary</text>
  <text class="zone-sub" x="648" y="102">SQLite as the IO contract</text>

  <rect class="zone" x="888" y="40" width="258" height="580" rx="18" />
  <text class="zone-title" x="916" y="78">Contained Runtime</text>
  <text class="zone-sub" x="916" y="102">Scoped execution and evidence</text>

  <rect class="node input" x="66" y="142" width="184" height="70" rx="12" />
  <text class="label" x="92" y="171">Messages</text>
  <text class="small" x="92" y="193">chat, email, webhooks</text>

  <rect class="node input" x="66" y="254" width="184" height="70" rx="12" />
  <text class="label" x="92" y="283">Scheduled Tasks</text>
  <text class="small" x="92" y="305">cron, once, interval</text>

  <rect class="node input" x="66" y="366" width="184" height="70" rx="12" />
  <text class="label" x="92" y="395">Admin Actions</text>
  <text class="small" x="92" y="417">groups, approvals, config</text>

  <rect class="node host" x="350" y="126" width="200" height="76" rx="12" />
  <text class="label" x="378" y="157">Channel Adapters</text>
  <text class="small" x="378" y="179">trigger and normalize IDs</text>

  <rect class="node host" x="350" y="236" width="200" height="76" rx="12" />
  <text class="label" x="378" y="267">Router + Permissions</text>
  <text class="small" x="378" y="289">map to group and session</text>

  <rect class="node host" x="350" y="346" width="200" height="76" rx="12" />
  <text class="label" x="378" y="377">Agent Groups</text>
  <text class="small" x="378" y="399">memory, skills, MCP, config</text>

  <rect class="node host" x="350" y="456" width="200" height="76" rx="12" />
  <text class="label" x="378" y="487">Delivery Guard</text>
  <text class="small" x="378" y="509">validate outbound responses</text>

  <rect class="node store" x="652" y="156" width="166" height="90" rx="12" />
  <text class="label" x="684" y="190">inbound.db</text>
  <text class="small" x="676" y="214">host writes</text>
  <text class="tiny" x="676" y="234">container reads only</text>

  <rect class="node store" x="652" y="334" width="166" height="90" rx="12" />
  <text class="label" x="678" y="368">outbound.db</text>
  <text class="small" x="676" y="392">container writes</text>
  <text class="tiny" x="676" y="412">host reads only</text>

  <rect class="node runtime" x="922" y="122" width="190" height="80" rx="12" />
  <text class="label" x="954" y="154">Container Runner</text>
  <text class="small" x="954" y="176">mounts, labels, argv calls</text>

  <rect class="node runtime" x="922" y="254" width="190" height="80" rx="12" />
  <text class="label" x="954" y="286">Agent Runner</text>
  <text class="small" x="954" y="308">provider + tools + MCP</text>

  <rect class="node risk" x="922" y="386" width="190" height="80" rx="12" />
  <text class="label" x="954" y="418">Agent Gate</text>
  <text class="small" x="954" y="440">risk scan and readiness</text>

  <rect class="node risk" x="922" y="510" width="190" height="70" rx="12" />
  <text class="label" x="954" y="539">Quarantine Plan</text>
  <text class="small" x="954" y="561">freeze, snapshot, isolate</text>

  <path class="flow" d="M250 177 H350" />
  <path class="flow" d="M250 289 H350" />
  <path class="flow" d="M250 401 H350" />
  <path class="flow" d="M450 202 V236" />
  <path class="flow" d="M550 274 H652" />
  <path class="flow" d="M818 201 C858 201 876 162 922 162" />
  <path class="flow" d="M1017 202 V254" />
  <path class="flow" d="M922 294 C874 294 858 379 818 379" />
  <path class="flow" d="M652 379 H550" />
  <path class="flow" d="M450 422 V456" />
  <path class="flow" d="M350 494 C260 494 250 436 158 436" />
  <path class="guard" d="M550 384 C620 480 820 486 922 426" />
  <path class="guard" d="M1017 466 V510" />

  <text class="tiny" x="642" y="612">Trust boundary: the host owns identity, permissions, credentials, delivery, and quarantine.</text>
</svg>
