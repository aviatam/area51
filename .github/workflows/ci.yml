name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint host
        run: pnpm run lint

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Host tests
        run: pnpm exec vitest run

      - name: Populated host-state recovery proof
        run: node --import tsx scripts/host-state-recovery-proof.ts

      - name: Upload host-state recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: host-state-recovery-proof-${{ github.run_id }}
          path: .area51/diagnostics/host-state-recovery-proof.json
          if-no-files-found: error

      - name: Governed bundle deployment
        run: |
          pnpm exec vitest --config vitest.skills.config.ts run .claude/skills/governed-escalation-demo/tests/*.test.ts
          bash .claude/skills/governed-escalation-demo/deploy.sh --mode contract --output-dir .area51/governed-ci
          node -e "const r=require('./.area51/governed-ci/reports/deployment.json'); if (!r.deployment_passed) process.exit(1)"

      - name: Public agent security lab
        run: |
          bash lab/agent-security/run.sh .area51/agent-security-ci
          cp .area51/agent-security-ci/reports/02-poisoned-policy.json /tmp/area51-poisoned-policy.json
          node -e "const fs=require('fs'); const p='.area51/agent-security-ci/reports/02-poisoned-policy.json'; const r=JSON.parse(fs.readFileSync(p)); r.runtime='docker'; fs.writeFileSync(p,JSON.stringify(r))"
          ! node lab/agent-security/verify.mjs .area51/agent-security-ci
          cp /tmp/area51-poisoned-policy.json .area51/agent-security-ci/reports/02-poisoned-policy.json
          node -e "const fs=require('fs'); const p='.area51/agent-security-ci/reports/assertions.json'; const r=JSON.parse(fs.readFileSync(p)); r.assertions[0].passed=false; fs.writeFileSync(p,JSON.stringify(r))"
          ! node lab/agent-security/verify.mjs .area51/agent-security-ci

      - name: Linux reboot verifier tests
        run: pnpm exec vitest --config vitest.skills.config.ts run .claude/skills/verify-linux-reboot/tests/verify.test.ts

      - name: Linux installer contract
        run: |
          bash -n install-linux.sh
          pnpm exec vitest run scripts/linux-installer-contract.test.ts

      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  github-tool-api-proof:
    name: Real GitHub tool API proof
    needs: ci
    if: github.repository == 'aviatam/area51' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify session-broker decisions against real GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AREA51_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/github-tool-api-proof.ts
      - name: Upload upstream observations
        uses: actions/upload-artifact@v4
        with:
          name: github-tool-api-proof-${{ github.run_id }}
          path: .area51/diagnostics/github-tool-api-proof.json
          if-no-files-found: error
