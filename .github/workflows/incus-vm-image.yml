name: Incus VM Image Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/incus-vm-image.yml
      - install-linux.sh
      - container/incus/build-vm.sh
      - container/agent-runner/**
      - container/skills/**
      - scripts/incus-vm-containment-e2e.ts
      - .claude/skills/governed-escalation-demo/**
      - src/incus-adapter.ts
      - src/incus-runtime.ts
      - src/incus-vm-disk.ts
      - src/incus-vm-network.ts
      - src/incus-vm-runtime.ts
      - src/incus-vm-provider-state.ts
      - src/incus-vm-session-bridge.ts
      - src/container-runner.ts
      - src/incus-quarantine-policy.ts
      - src/live-runtime-policy.ts
      - src/runtime-policy.ts

permissions:
  contents: read

jobs:
  vm-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable and verify nested KVM
        run: |
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo
          test -e /dev/kvm
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install and initialize Incus
        run: |
          key_file="$(mktemp)"
          curl -fsSL https://pkgs.zabbly.com/key.asc -o "$key_file"
          gpg --show-keys --with-colons "$key_file" | grep -q '^fpr:::::::::4EFC590696CB15B87C73A3AD82CC8797C838DCFD:'
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$key_file" /etc/apt/keyrings/zabbly.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Enabled: yes' \
            'Types: deb' \
            'URIs: https://pkgs.zabbly.com/incus/lts-7.0' \
            "Suites: ${VERSION_CODENAME}" \
            'Components: main' \
            "Architectures: ${architecture}" \
            'Signed-By: /etc/apt/keyrings/zabbly.asc' | sudo tee /etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y incus acl qemu-system-x86
          sudo setfacl -m "u:${USER}:rw" /var/lib/incus/unix.socket
          incus admin init --minimal
          incus profile device show default
          incus network list
          subnet="$(incus network get incusbr0 ipv4.address)"
          uplink="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD 1 -i incusbr0 -o "$uplink" -j ACCEPT
          sudo iptables -I FORWARD 1 -i "$uplink" -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -I POSTROUTING 1 -s "$subnet" -o "$uplink" -j MASQUERADE
          incus version
          incus storage volume file push --help | grep -q -- '--create-dirs'
      - name: Build VM-native Area51 image
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: bash container/incus/build-vm.sh
      - name: Boot and verify baked runtime
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: |
          instance="area51-vm-image-smoke-${{ github.run_id }}"
          incus launch "local:${AREA51_INCUS_VM_IMAGE_ALIAS}" "$instance" --vm
          ready=false
          for _ in $(seq 1 90); do
            if incus exec "$instance" -- true >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          incus exec "$instance" -- test -x /usr/local/bin/bun
          incus exec "$instance" -- test -d /app/node_modules
          incus exec "$instance" -- test -f /app/src/index.ts
          incus exec "$instance" -- grep -qx vm /etc/area51/image-kind
      - name: Run VM containment E2E
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
          AREA51_INCUS_STORAGE_POOL: default
        run: bash .claude/skills/governed-escalation-demo/deploy.sh --mode live
      - name: Cleanup
        if: always()
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: |
          incus delete area51-vm-image-smoke-${{ github.run_id }} --force >/dev/null 2>&1 || true
          incus image delete "$AREA51_INCUS_VM_IMAGE_ALIAS" >/dev/null 2>&1 || true

  linux-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AREA51_INSTALL_DIR: /tmp/area51-install
      AREA51_REF: ${{ github.head_ref }}
      AREA51_REEXEC_SG: '1'
      AREA51_SKIP: environment,container,onecli,auth,mounts,service,cli-agent,timezone,channel,verify,first-chat
    steps:
      - name: Verify disposable KVM host
        run: |
          test "$(id -u)" -ne 0
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo
          test -e /dev/kvm
          test "$(awk '/^MemTotal:/ {printf "%d", $2 / 1024}' /proc/meminfo)" -ge 3700

      - name: Run candidate one-command installer
        env:
          INSTALLER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/aviatam/area51/${INSTALLER_REF}/install-linux.sh" |
            bash -s -- --yes

      - name: Verify installed runtime and governance evidence
        run: |
          incus version
          incus image info area51-agent-v2
          incus image info area51-agent-v2-vm
          test -f "$AREA51_INSTALL_DIR/.area51/governed-demo/reports/deployment.json"
          node -e "const r=require(process.env.AREA51_INSTALL_DIR+'/.area51/governed-demo/reports/deployment.json'); if (r.mode !== 'production' || !r.preflight_passed || !r.deployment_passed || !r.governance_applied) process.exit(1)"
          grep -qx 'AREA51_RUNTIME_BACKEND=incus' "$AREA51_INSTALL_DIR/.env"
          grep -qx 'AREA51_INCUS_IMAGE=local:area51-agent-v2' "$AREA51_INSTALL_DIR/.env"
          test -z "$(git -C "$AREA51_INSTALL_DIR" status --porcelain)"

      - name: Verify Incus egress recovery after service restart
        run: |
          network="$(incus profile device get default eth0 network)"
          subnet="$(incus network get "$network" ipv4.address)"
          uplink="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo iptables -D FORWARD -i "$network" -o "$uplink" -j ACCEPT
          sudo iptables -D FORWARD -i "$uplink" -o "$network" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -D POSTROUTING -s "$subnet" -o "$uplink" -j MASQUERADE
          sudo sysctl -w net.ipv4.ip_forward=0
          sudo systemctl restart area51-incus-egress.service
          test "$(sysctl -n net.ipv4.ip_forward)" = 1
          sudo iptables -C FORWARD -i "$network" -o "$uplink" -j ACCEPT
          sudo iptables -C FORWARD -i "$uplink" -o "$network" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -C POSTROUTING -s "$subnet" -o "$uplink" -j MASQUERADE
          systemctl is-enabled --quiet area51-incus-egress.service

      - name: Verify repeat installation
        env:
          INSTALLER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/aviatam/area51/${INSTALLER_REF}/install-linux.sh" |
            bash -s -- --yes
          node -e "const r=require(process.env.AREA51_INSTALL_DIR+'/.area51/governed-demo/reports/deployment.json'); if (!r.deployment_passed) process.exit(1)"
