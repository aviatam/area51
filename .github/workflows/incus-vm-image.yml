name: Incus VM Image Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/incus-vm-image.yml
      - container/incus/build-vm.sh
      - container/agent-runner/**
      - container/skills/**
      - scripts/incus-vm-containment-e2e.ts
      - src/incus-adapter.ts
      - src/incus-runtime.ts
      - src/incus-vm-disk.ts
      - src/incus-vm-network.ts
      - src/incus-vm-runtime.ts
      - src/container-runner.ts

permissions:
  contents: read

jobs:
  vm-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable and verify nested KVM
        run: |
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo
          test -e /dev/kvm
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install and initialize Incus
        run: |
          key_file="$(mktemp)"
          curl -fsSL https://pkgs.zabbly.com/key.asc -o "$key_file"
          gpg --show-keys --with-colons "$key_file" | grep -q '^fpr:::::::::4EFC590696CB15B87C73A3AD82CC8797C838DCFD:'
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$key_file" /etc/apt/keyrings/zabbly.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Enabled: yes' \
            'Types: deb' \
            'URIs: https://pkgs.zabbly.com/incus/lts-7.0' \
            "Suites: ${VERSION_CODENAME}" \
            'Components: main' \
            "Architectures: ${architecture}" \
            'Signed-By: /etc/apt/keyrings/zabbly.asc' | sudo tee /etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y incus acl qemu-system-x86
          sudo setfacl -m "u:${USER}:rw" /var/lib/incus/unix.socket
          incus admin init --minimal
          incus profile device show default
          incus network list
          subnet="$(incus network get incusbr0 ipv4.address)"
          uplink="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD 1 -i incusbr0 -o "$uplink" -j ACCEPT
          sudo iptables -I FORWARD 1 -i "$uplink" -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -I POSTROUTING 1 -s "$subnet" -o "$uplink" -j MASQUERADE
          incus version
          incus storage volume file push --help | grep -q -- '--create-dirs'
      - name: Build VM-native Area51 image
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: bash container/incus/build-vm.sh
      - name: Boot and verify baked runtime
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: |
          instance="area51-vm-image-smoke-${{ github.run_id }}"
          incus launch "local:${AREA51_INCUS_VM_IMAGE_ALIAS}" "$instance" --vm
          ready=false
          for _ in $(seq 1 90); do
            if incus exec "$instance" -- true >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          incus exec "$instance" -- test -x /usr/local/bin/bun
          incus exec "$instance" -- test -d /app/node_modules
          incus exec "$instance" -- test -f /app/src/index.ts
          incus exec "$instance" -- grep -qx vm /etc/area51/image-kind
      - name: Run VM containment E2E
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
          AREA51_INCUS_STORAGE_POOL: default
        run: pnpm exec tsx scripts/incus-vm-containment-e2e.ts
      - name: Cleanup
        if: always()
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: |
          incus delete area51-vm-image-smoke-${{ github.run_id }} --force >/dev/null 2>&1 || true
          incus image delete "$AREA51_INCUS_VM_IMAGE_ALIAS" >/dev/null 2>&1 || true
