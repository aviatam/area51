name: Groq agent inside Incus VM proof
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Synthetic request for a neutral VM demo check
        required: true
        default: Demonstrate an Area51 action requested from an isolated VM
  push:
    branches: [test/groq-vm-proof]
    paths:
      - scripts/groq-vm-*
      - scripts/tool-broker-vm-fixture.ts
      - scripts/incus-vm-containment-e2e.ts
      - .github/workflows/groq-vm-proof.yml
  pull_request:
    paths:
      - scripts/groq-vm-*
      - .github/workflows/groq-vm-proof.yml
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run scripts/groq-vm-proof.test.ts scripts/groq-vm-summary.test.ts scripts/tool-broker-vm-fixture.test.ts scripts/mvp-groq-demo.test.ts
      - run: pnpm exec eslint scripts/groq-vm-proof.ts scripts/groq-vm-proof.test.ts scripts/groq-vm-summary.ts scripts/tool-broker-vm-fixture.ts
      - run: pnpm exec tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck --strict scripts/groq-vm-proof.ts scripts/groq-vm-summary.ts
  vm-proof:
    if: github.repository == 'aviatam/area51' && ((github.event_name == 'push' && github.ref == 'refs/heads/test/groq-vm-proof') || (github.event_name == 'workflow_dispatch' && github.actor == 'aviatam' && github.triggering_actor == 'aviatam'))
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable and verify nested KVM
        run: |
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo
          test -e /dev/kvm
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install and initialize Incus
        run: |
          bash scripts/prepare-ci-apt.sh
          key_file="$(mktemp)"
          curl -fsSL https://pkgs.zabbly.com/key.asc -o "$key_file"
          gpg --show-keys --with-colons "$key_file" | grep -q '^fpr:::::::::4EFC590696CB15B87C73A3AD82CC8797C838DCFD:'
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$key_file" /etc/apt/keyrings/zabbly.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Enabled: yes' \
            'Types: deb' \
            'URIs: https://pkgs.zabbly.com/incus/lts-7.0' \
            "Suites: ${VERSION_CODENAME}" \
            'Components: main' \
            "Architectures: ${architecture}" \
            'Signed-By: /etc/apt/keyrings/zabbly.asc' | sudo tee /etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y incus acl qemu-system-x86
          sudo setfacl -m "u:${USER}:rw" /var/lib/incus/unix.socket
          incus admin init --minimal
          subnet="$(incus network get incusbr0 ipv4.address)"
          uplink="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD 1 -i incusbr0 -o "$uplink" -j ACCEPT
          sudo iptables -I FORWARD 1 -i "$uplink" -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -I POSTROUTING 1 -s "$subnet" -o "$uplink" -j MASQUERADE
          incus version
          incus storage volume file push --help | grep -q -- '--create-dirs'
      - name: Build VM-native Area51 image
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
        run: bash container/incus/build-vm.sh
      - name: Run three real Groq VM trials
        env:
          AREA51_INCUS_VM_IMAGE_ALIAS: area51-agent-v2-vm-ci-${{ github.run_id }}
          AREA51_INCUS_STORAGE_POOL: default
          AREA51_GROQ_VM_PROOF: '1'
          AREA51_GROQ_PROMPT: ${{ inputs.prompt }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .area51/diagnostics
          for trial in 1 2 3; do
            AREA51_E2E_TRIAL="$trial" pnpm exec tsx scripts/incus-vm-containment-e2e.ts 2>&1 | tee ".area51/diagnostics/groq-vm-$trial.log"
          done
          pnpm exec tsx scripts/groq-vm-summary.ts
      - name: Upload Groq VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-vm-evidence-${{ github.run_id }}
          path: .area51/diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
