name: Cross-OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-os-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-behavior:
    name: Host behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            allow-failure: false
          - os: macos-latest
            allow-failure: false
          # Windows runs on every change, but stays non-blocking until the
          # known filesystem/process portability failures are fixed.
          - os: windows-latest
            allow-failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Prepare Windows temp roots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\tmp | Out-Null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck host
        run: pnpm run typecheck

      - name: Host tests
        run: pnpm exec vitest run
