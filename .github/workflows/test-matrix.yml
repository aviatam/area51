name: Cross-OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-os-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-behavior:
    name: Host behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-command: pnpm exec vitest run
          - os: macos-latest
            test-command: pnpm exec vitest run
          - os: windows-latest
            # Windows runs the portable host behavior suite as a blocking lane.
            # The full corpus still contains POSIX-specific cases that need
            # Bash, Unix symlink privileges, or executable-bit semantics.
            test-command: >-
              pnpm exec vitest run
              src/area51-demo.test.ts
              src/agent-gate.test.ts
              src/attachment-naming.test.ts
              src/container-config.test.ts
              src/container-runner.test.ts
              src/container-runtime.test.ts
              src/db/container-configs.test.ts
              src/modules/scheduling/db.test.ts
              src/modules/scheduling/recurrence.test.ts
              setup/channels/run-channel-skill.test.ts
              scripts/skill-directives.test.ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Prepare Windows temp roots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\tmp | Out-Null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: High severity dependency audit
        run: pnpm audit --audit-level high

      - name: Typecheck host
        run: pnpm run typecheck

      - name: Host tests
        run: ${{ matrix.test-command }}
