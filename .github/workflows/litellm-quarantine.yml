name: LiteLLM live agent quarantine
on:
  workflow_dispatch:
  push:
    branches: [test/litellm-quarantine, feat/automatic-security-standalone]
  pull_request:
    paths:
      - src/dependency-*.ts
      - src/dependency-security-pins.json
      - src/python-package-risk*
      - src/agent-gate.ts
      - src/runtime-policy.ts
      - .claude/skills/litellm-quarantine/**
      - scripts/litellm-relay.test.ts
      - .github/workflows/litellm-quarantine.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec prettier --check src/python-package-risk*.ts src/agent-gate.ts src/runtime-policy.ts .claude/skills/litellm-quarantine/*.ts scripts/litellm-relay.test.ts .github/workflows/litellm-quarantine.yml
      - run: pnpm exec tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --resolveJsonModule --esModuleInterop --skipLibCheck --strict .claude/skills/litellm-quarantine/run.ts
  live:
    needs: tests
    if: github.repository == 'aviatam/area51' && ((github.event_name == 'push' && (github.ref == 'refs/heads/test/litellm-quarantine' || github.ref == 'refs/heads/feat/automatic-security-standalone')) || (github.event_name == 'workflow_dispatch' && github.actor == 'aviatam' && github.triggering_actor == 'aviatam'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AREA51_LITELLM_IMAGE: area51-litellm-${{ github.run_id }}
      AREA51_INCUS_STORAGE_POOL: default
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify nested KVM
        run: |
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Incus
        run: |
          bash scripts/prepare-ci-apt.sh
          key_file="$(mktemp)"
          curl -fsSL https://pkgs.zabbly.com/key.asc -o "$key_file"
          gpg --show-keys --with-colons "$key_file" | grep -q '^fpr:::::::::4EFC590696CB15B87C73A3AD82CC8797C838DCFD:'
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$key_file" /etc/apt/keyrings/zabbly.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' 'Enabled: yes' 'Types: deb' 'URIs: https://pkgs.zabbly.com/incus/lts-7.0' "Suites: ${VERSION_CODENAME}" 'Components: main' "Architectures: ${architecture}" 'Signed-By: /etc/apt/keyrings/zabbly.asc' | sudo tee /etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y incus acl qemu-system-x86
          sudo setfacl -m "u:${USER}:rw" /var/lib/incus/unix.socket
          incus admin init --minimal
          subnet="$(incus network get incusbr0 ipv4.address)"
          uplink="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD 1 -i incusbr0 -o "$uplink" -j ACCEPT
          sudo iptables -I FORWARD 1 -i "$uplink" -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -I POSTROUTING 1 -s "$subnet" -o "$uplink" -j MASQUERADE
          incus storage volume file push --help | grep -q -- '--create-dirs'
      - name: Build clean LiteLLM image without model credentials
        run: bash .claude/skills/litellm-quarantine/build-image.sh
      - name: Run actual LiteLLM agent, then automatically detect and quarantine VM
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pnpm exec tsx .claude/skills/litellm-quarantine/run.ts
          cat .area51/diagnostics/litellm/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litellm-quarantine-${{ github.run_id }}
          path: .area51/diagnostics/litellm
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
